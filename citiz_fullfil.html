    const { degrees, PDFDocument, rgb, StandardFonts } = PDFLib

async function modifyPdf() {
  try {
    // Fetch an existing PDF document
    const url = './doc_base.pdf'; // Your PDF file URL
    const existingPdfBytes = await fetch(url, {
      method: 'GET',
      mode: 'same-origin', // or 'cors' if files are from a different domain
    })
      .then(res => res.arrayBuffer())
      .catch(error => {
        console.error('Error fetching PDF:', error);
        throw error;
      });

    // Check if the fetched content is an ArrayBuffer
    if (!existingPdfBytes || existingPdfBytes.byteLength === 0) {
      console.error('Fetched data is empty or not an ArrayBuffer');
      return;
    }

    console.log('Fetched ArrayBuffer:', existingPdfBytes); // Check the ArrayBuffer content

    // Check if it's a PDF by looking for the signature "%PDF-"
    const view = new Uint8Array(existingPdfBytes);
    const pdfSignature = "%PDF-".split('').map(c => c.charCodeAt(0)); // Convert to char codes

    let isPdf = true;
    for (let i = 0; i < pdfSignature.length; i++) {
      if (view[i] !== pdfSignature[i]) {
        isPdf = false;
        break;
      }
    }

    if (isPdf) {
      console.log("This is a valid PDF.");
      // Proceed to modify the PDF
      await modifyPdfContent(existingPdfBytes);
    } else {
      console.log("This is not a PDF file.");
    }
  } catch (error) {
    console.error('Error:', error);
  }
}
