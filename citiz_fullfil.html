<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://unpkg.com/pdf-lib@1.4.0"></script>
    <script src="https://unpkg.com/downloadjs@1.4.7"></script>
  </head>

  <body>
    <p>Clique ci-dessous pour faire fonctionner le code <code>pdf-lib</code></p>
    <button onclick="modifyPdf()">Remplir le document PDF</button>
    <p class="small">(Your browser will download the resulting file)</p>
  </body>

  <script>
    const { degrees, PDFDocument, rgb, StandardFonts } = PDFLib

    async function modifyPdf() {
      // Fetch an existing PDF document
      const url = './doc_base.pdf'
  		const existingPdfBytes = await fetch(url, {
            method: 'GET',
            mode: 'cors' // ou 'same-origin' si les fichiers sont sur le même domaine
        })
         .then(res => res.arrayBuffer())
        .then(data => console.log(data))
        .catch(error => console.error('Erreur:', error))

      // Load a PDFDocument from the existing PDF bytes
      const pdfDoc = await PDFDocument.load(existingPdfBytes)

      // Embed the Helvetica font
      const helveticaFont = await pdfDoc.embedFont(StandardFonts.Helvetica)

      // Get the first page of the document
      const pages = pdfDoc.getPages()
      const firstPage = pages[0]

      // Get the width and height of the first page
      const { width, height } = firstPage.getSize()

      // Draw a string of text diagonally across the first page
      firstPage.drawText('Strascross - Timut Petit (Conducteur principal : Pierre Jourquin)', {
        x: 5,
        y: 756,
        size: 12,
        font: helveticaFont
      })

      firstPage.drawText('X', {
        x: 5,
        y: 500,
        size: 12,
        font: helveticaFont
      })

      firstPage.drawText('NOM!', {
        x: 10,
        y: 460,
        size: 12,
        font: helveticaFont
      })

      firstPage.drawText('PRENOM', {
        x: 15,
        y: 400,
        size: 12,
        font: helveticaFont
      })

      // Serialize the PDFDocument to bytes (a Uint8Array)
      const pdfBytes = await pdfDoc.save()

			// Trigger the browser to download the PDF document
      download(pdfBytes, "citiz_complete.pdf", "application/pdf");
    }
  </script>
</html>
