<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src=" https://cdn.jsdelivr.net/npm/downloadjs@1.4.7/download.min.js "></script>
    <title>2nd conducteur</title>
  </head>

  <body>

      <!-- Input Fields -->
  <h4>Nouveau conducteur / nouvelle conductrice</h4>
  <label for="nom">Nom </label>
  <input type="text" id="nom" placeholder="DUPONT">
  <br>
    <label for="prenom">Prénom</label>
  <input type="text" id="prenom" placeholder="Jean">
  <br>

  <h4>Période</h4>
  <label for="date1">Date début</label>
  <input type="date" id="date1">
  <br>

  <label for="date2">Date fin</label>
  <input type="date" id="date2">
  <br><br>

    <p>Cliquez ci-dessous pour générer l'avenant au contrat.</p>
    <button onclick="modifyPdf()">Remplir le document PDF</button>
    <p class="small">(Le navigateur téléchargera la version finale)</p>
  </body>

  <script>
    const { degrees, PDFDocument, rgb, StandardFonts } = PDFLib

async function modifyPdf() {
  try {
    // Fetch an existing PDF document
    const url = './doc_base.pdf'; // Your PDF file URL
    const existingPdfBytes = await fetch(url, {
      method: 'GET',
      mode: 'same-origin', // or 'cors' if files are from a different domain
    })
      .then(res => res.arrayBuffer())
      .catch(error => {
        console.error('Error fetching PDF:', error);
        throw error;
      });

    // Check if the fetched content is an ArrayBuffer
    if (!existingPdfBytes || existingPdfBytes.byteLength === 0) {
      console.error('Fetched data is empty or not an ArrayBuffer');
      return;
    }

    console.log('Fetched ArrayBuffer:', existingPdfBytes); // Check the ArrayBuffer content

    // Check if it's a PDF by looking for the signature "%PDF-"
    const view = new Uint8Array(existingPdfBytes);
    const pdfSignature = "%PDF-".split('').map(c => c.charCodeAt(0)); // Convert to char codes

    let isPdf = true;
    for (let i = 0; i < pdfSignature.length; i++) {
      if (view[i] !== pdfSignature[i]) {
        isPdf = false;
        break;
      }
    }

    if (isPdf) {
      console.log("This is a valid PDF.");
      // Proceed to modify the PDF
      await modifyPdfContent(existingPdfBytes);
    } else {
      console.log("This is not a PDF file.");
    }
  } catch (error) {
    console.error('Error:', error);
  }
}

function formatDate(inputDate) {
  const date = new Date(inputDate);
  const day = String(date.getDate()).padStart(2, '0'); // Add leading zero
  const month = String(date.getMonth() + 1).padStart(2, '0'); // Months are 0-based
  const year = date.getFullYear();
  return `${day}/${month}/${year}`;
}



// Function to modify the PDF content using pdf-lib
async function modifyPdfContent(existingPdfBytes) {

// Get user inputs
  const nom = document.getElementById('nom').value || 'Default Text 1';
  const date1Raw = document.getElementById('date1').value || '2024-01-01';
  const prenom = document.getElementById('prenom').value || 'Default Text 2';
  const date2Raw = document.getElementById('date2').value || '2024-01-02';

  // Format dates
  const date1 = formatDate(date1Raw);
  const date2 = formatDate(date2Raw);

  console.log('Nom :', nom);
  console.log('Prénom :', prenom);
  console.log('Date1 :', date1);
  console.log('Date2 :', date2);

  // Load a PDFDocument from the existing PDF bytes
      const pdfDoc = await PDFDocument.load(existingPdfBytes)

      // Embed the Helvetica font
      const helveticaFont = await pdfDoc.embedFont(StandardFonts.Helvetica)

      // Get the first page of the document
      const pages = pdfDoc.getPages()
      const firstPage = pages[0]

      // Get the width and height of the first page
      const { width, height } = firstPage.getSize()
      console.log("Largeur :", width)
      console.log("Hauteur :", height)


      // Draw a string of text diagonally across the first page
      firstPage.drawText('Strascross - Timut Petit (Conducteur principal : Pierre Jourquin)', {
        x: 135,
        y: 756,
        size: 10,
        font: helveticaFont
      })

      firstPage.drawText('X', {
        x: 70,
        y: 491,
        size: 9,
        font: helveticaFont
      })

      firstPage.drawText('X', {
        x: 395,
        y: 464,
        size: 9,
        font: helveticaFont
      })

      firstPage.drawText(nom, {
        x: 380,
        y: 390,
        size: 10,
        font: helveticaFont
      })

      firstPage.drawText(prenom, {
        x: 383,
        y: 368,
        size: 10,
        font: helveticaFont
      })

        firstPage.drawText(date1, {
        x: 380,
        y: 345,
        size: 10,
        font: helveticaFont
      })

        firstPage.drawText(date2, {
        x: 380,
        y: 330,
        size: 10,
        font: helveticaFont
      })
        const today = new Date();
    const formattedDate = new Intl.DateTimeFormat('fr-FR').format(today);

        firstPage.drawText(formattedDate, {
        x: 110,
        y: 98,
        size: 8,
        font: helveticaFont
      })

        firstPage.drawText('Strasbourg', {
        x: 110,
        y: 110,
        size: 8,
        font: helveticaFont
      })

      // Serialize the PDFDocument to bytes (a Uint8Array)
      const pdfBytes = await pdfDoc.save()

      // Trigger the browser to download the PDF document
      download(pdfBytes, "citiz_complete.pdf", "application/pdf");

      console.log('PDF modified and ready to download!');
    }



      
  </script>
</html>
